<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Mont";
    src: url("__FONT__") format("truetype");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    font-family: "Mont", sans-serif;
    color: #fff;
    background: #04081c;
    -webkit-font-smoothing: antialiased;
    font-kerning: normal;
    font-variant-numeric: tabular-nums lining-nums;
  }

  /* ---------- zemin ---------- */
  .zemin { position: absolute; inset: 0; overflow: hidden; }
  .zemin img { position: absolute; display: block; }
  .gece .zemin {
    background: linear-gradient(180deg, #050f52 0%, #0d2479 22%, #1d3f9e 40%,
                #0b1230 66%, #03050f 100%);
  }
  .gece .zemin img {
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 26%,
                        #000 66%, transparent 98%);
  }
  .avlu .zemin::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(4,12,58,.94) 0%, rgba(6,18,74,.82) 24%,
                      rgba(8,24,90,.38) 44%, rgba(8,24,90,0) 58%),
      linear-gradient(0deg, rgba(2,4,14,.96) 0%, rgba(2,4,14,.72) 16%,
                      rgba(2,4,14,0) 34%);
  }

  /* ---------- üst blok ---------- */
  .ust {
    position: absolute; left: 0; right: 0; top: var(--ust);
    display: flex; flex-direction: column; align-items: center;
    padding: 0 calc(64px * var(--s));
    text-align: center;
  }
  .kas {
    display: flex; align-items: center; gap: calc(18px * var(--s));
    font-weight: 600; font-size: calc(23px * var(--s));
    letter-spacing: .34em; color: #f6c46a;
    padding-left: .34em;
  }
  .kas::before, .kas::after {
    content: ""; width: calc(46px * var(--s)); height: 1.5px;
    background: rgba(246,196,106,.75);
  }
  .alt-baslik {
    margin-top: calc(26px * var(--s));
    font-weight: 600; font-size: calc(42px * var(--s));
    letter-spacing: .08em; padding-left: .08em;
  }
  h1 {
    margin-top: calc(6px * var(--s));
    font-weight: 800; font-size: calc(100px * var(--s));
    line-height: 1.04; letter-spacing: -.012em; white-space: nowrap;
    background: linear-gradient(90deg, #ff4f33 0%, #ff8a2c 48%, #ffc23a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 calc(3px * var(--s)) calc(10px * var(--s)) rgba(0,0,0,.22));
  }

  /* ---------- fiyat paneli ---------- */
  .panel {
    margin-top: calc(40px * var(--s));
    width: 100%;
    border: 1.5px solid rgba(255,255,255,.62);
    border-radius: calc(30px * var(--s));
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    padding: calc(24px * var(--s)) calc(30px * var(--s)) calc(28px * var(--s));
  }
  .panel-ust {
    display: flex; justify-content: space-between; align-items: center;
  }
  .etiket {
    font-weight: 800; font-size: calc(26px * var(--s)); letter-spacing: .04em;
    color: #1a1204;
    background: linear-gradient(90deg, #ffb33a, #ffd36e);
    border-radius: 999px;
    padding: calc(9px * var(--s)) calc(22px * var(--s));
  }
  .panel-not {
    font-weight: 600; font-size: calc(19px * var(--s));
    letter-spacing: .16em; color: rgba(255,255,255,.82);
  }
  .sutunlar {
    margin-top: calc(22px * var(--s));
    display: grid; grid-template-columns: 1.3fr .85fr 1.3fr;
  }
  .sutun { text-align: center; padding: 0 calc(6px * var(--s)); }
  .sutun + .sutun { border-left: 1.5px solid rgba(255,255,255,.28); }
  .lbl {
    font-weight: 600; font-size: calc(18px * var(--s));
    letter-spacing: .18em; color: rgba(255,255,255,.78);
    padding-left: .18em;
  }
  .val {
    margin-top: calc(8px * var(--s));
    font-weight: 700; font-size: calc(54px * var(--s));
    letter-spacing: -.02em; line-height: 1;
    white-space: nowrap;
  }
  .val small {
    font-size: .56em; font-weight: 700; margin-left: .06em;
    vertical-align: .55em; letter-spacing: 0;
  }

  .yoklar {
    margin-top: calc(24px * var(--s));
    font-weight: 600; font-size: calc(20px * var(--s));
    letter-spacing: .2em; padding-left: .2em;
    color: rgba(255,255,255,.9);
  }
  .yoklar b { color: #f6c46a; font-weight: 700; padding: 0 .5em; }

  /* ---------- alt bant ---------- */
  .alt {
    position: absolute; left: 0; right: 0; bottom: var(--alt);
    display: flex; flex-direction: column; align-items: center;
  }
  .logolar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    width: calc(100% - 120px * var(--s));
  }
  .logolar .kutu { display: flex; align-items: center; }
  .logolar .kutu:first-child { justify-content: flex-start; }
  .logolar .kutu:last-child  { justify-content: flex-end; }
  .logolar .orta {
    padding: 0 calc(46px * var(--s));
    border-left: 1.5px solid rgba(255,255,255,.3);
    border-right: 1.5px solid rgba(255,255,255,.3);
  }
  .l-tilda { height: calc(56px * var(--s)); }
  .l-mia   { height: calc(118px * var(--s)); }
  .l-ocean { height: calc(70px * var(--s)); }
  .iletisim {
    margin-top: calc(30px * var(--s));
    display: flex; align-items: center; gap: calc(22px * var(--s));
    font-size: calc(30px * var(--s));
  }
  .iletisim .tel { font-weight: 700; letter-spacing: .02em; }
  .iletisim .ayr { width: 1.5px; height: 1em; background: rgba(255,255,255,.45); }
  .iletisim .web { font-weight: 500; letter-spacing: .04em; color: rgba(255,255,255,.9); }
</style>
</head>
<body class="__TUR__" style="__VARS__">
  <div class="zemin"><img src="__IMG__" style="__IMGSTYLE__"></div>

  <div class="ust">
    <div class="kas">İZMİT · MİA BÖLGESİ</div>
    <div class="alt-baslik">HAYALİNİZDEKİ YAŞAM</div>
    <h1 id="baslik">MİA PARK OCEAN'DA!</h1>

    <div class="panel">
      <div class="panel-ust">
        <span class="etiket">__TIP__ DAİRE</span>
        <span class="panel-not">'DEN BAŞLAYAN FİYATLARLA</span>
      </div>
      <div class="sutunlar">
        <div class="sutun"><div class="lbl">PEŞİNAT</div>
          <div class="val">__PESINAT__<small>₺</small></div></div>
        <div class="sutun"><div class="lbl">VADE</div>
          <div class="val">60 AY</div></div>
        <div class="sutun"><div class="lbl">AYLIK TAKSİT</div>
          <div class="val">__TAKSIT__<small>₺</small></div></div>
      </div>
    </div>

    <div class="yoklar">BANKA YOK<b>·</b>FAİZ YOK<b>·</b>ARA ÖDEME YOK</div>
  </div>

  <div class="alt">
    <div class="logolar">
      <div class="kutu"><img class="l-tilda" src="__L_TILDA__"></div>
      <div class="kutu orta"><img class="l-mia" src="__L_MIA__"></div>
      <div class="kutu"><img class="l-ocean" src="__L_OCEAN__"></div>
    </div>
    <div class="iletisim">
      <span class="tel">0540 028 00 41</span><span class="ayr"></span>
      <span class="web">miaparkocean.com</span>
    </div>
  </div>

<script>
  // başlık panel genişliğine sığsın
  const h = document.getElementById("baslik");
  const sinir = document.querySelector(".panel").getBoundingClientRect().width;
  let fs = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > sinir && fs > 20) { fs -= 1; h.style.fontSize = fs + "px"; }
</script>
</body>
</html>
